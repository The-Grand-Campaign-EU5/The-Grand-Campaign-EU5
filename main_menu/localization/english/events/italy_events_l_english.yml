l_english:
 italy.1.title: "The Passing of Our Sovereign Duchess"
 italy.1.desc: "On the 14th of November, 1829, Her Grace Maria Beatrice Ricciarda d'Este, sovereign Duchess of Massa and Princess of Carrara, departed this world in Vienna at the age of seventy-nine. She was the last of the ancient House of Este, the last of the Cybo-Malaspina, and through her grandmother Ricciarda Gonzaga, the last of the Gonzaga of Novellara.\n\nUnlike the Duchy of Modena, bound by Salic Law and barred from female succession, our land has always permitted a woman to rule. It was through her mother, Maria Teresa Cybo-Malaspina, that Maria Beatrice inherited Massa and Carrara in 1790, and for nearly forty years she held our sovereignty through war, revolution, and restoration.\n\nNow, with no direct heir of her body to continue the separate line, the crown passes to her son: Francis IV of Austria-Este, who already rules as Duke of Modena and Reggio. Our land shall be joined to his in personal union. We mourn the end of an independent dynasty that stretches back to Iacopo Malaspina himself."
 italy.1.a: "God rest our Duchess. The Duke of Modena is now our sovereign."
 italy.2.title: "The Inheritance of Massa and Carrara"
 italy.2.desc: "Word has arrived from Vienna: Maria Beatrice d'Este, sovereign Duchess of Massa and Princess of Carrara, has died at the age of seventy-nine. She was the mother of our own Duke, Francis IV, and the last independent ruler of the Cybo-Malaspina domains in Lunigiana.\n\nThe Duchy of Massa and Principality of Carrara, unlike Modena, were never subject to Salic Law. Female succession was permitted there for centuries, which is how Maria Beatrice inherited those lands from her mother in the first place. But now that ancient exception has run its course. Her son Francis IV, already our sovereign by right of the 1753 Convention that brought the House of Austria-Este to Modena, inherits Massa and Carrara as well.\n\nFor the first time, the lands of the Este and the lands of the Cybo-Malaspina shall be joined under one ruler. The marble quarries of Carrara and the port of Massa are now ours."
 italy.2.a: "A fortunate inheritance. Long live Francis IV."
 italy.3.title: "The End of Our Sovereignty"
 italy.3.desc: "Seven years have passed since our land entered into personal union with the Duchy of Modena. Though our Duke, Francis IV, has ruled us since 1829, Massa and Carrara have remained legally distinct — our ancient institutions, privileges, and identity preserved in name if not in substance.\n\nThat ambiguity ends today. By ducal decree, the sovereign Duchy of Massa and Principality of Carrara are formally dissolved as separate entities. Our territories are to be reorganized as a mere district of the Duchy of Modena and Reggio, governed by the same laws and the same administration as any other province of the Este realm.\n\nThe state that Iacopo Malaspina forged in 1473, that the Cybo family nurtured and Maria Beatrice defended through exile and restoration, now ceases to exist. The Lunigiana passes into history."
 italy.3.a: "We are Massesi no longer. Now we are Modenese."
 italy.4.title: "The Incorporation of Massa and Carrara"
 italy.4.desc: "Since 1829, the Duchy of Massa and Principality of Carrara have been held by our Duke in personal union — a separate crown worn on the same head. But a personal union is an awkward arrangement, and the old Cybo-Malaspina institutions have lingered as an administrative nuisance long enough.\n\nDuke Francis IV has issued a decree formally dissolving the sovereign status of Massa and Carrara. Henceforth, the territories shall be organized as a district of the Duchy of Modena and Reggio, fully integrated into our laws, our bureaucracy, and our realm. The marble of Carrara and the harbors of Massa shall contribute directly to the ducal treasury without the pretense of a separate state.\n\nThe last remnant of the old Lunigiana order is swept away. What was once a rival principality is now simply our westernmost province."
 italy.4.a: "A tidy resolution to an untidy arrangement."
 italy.5.title: "The [GetCurrentYear] Treaty of Florence"
 italy.5.desc: "The Final Act of the Congress of Vienna left the Lunigiana in a tangle. Marie Louise of Austria — Napoleon's widow — was granted the Duchy of Parma, Piacenza, and Guastalla for her lifetime. The dispossessed Bourbon-Parma were compensated with the Duchy of Lucca, to be held until Marie Louise's death, at which point Parma would revert to them and Lucca would pass to Tuscany. Modena was promised territorial adjustments, and the whole arrangement was guaranteed by the Habsburg Crown.\n\nThree decades later, the ambiguities have calcified into disputes. Sardinia-Piedmont still nurses a residual claim to Parma from the 1748 Treaty of Aix-la-Chapelle, a loose thread the Congress never fully cut. The border between the duchies is a patchwork of exclaves and enclaves — Tuscan, Modenese, Lucchese, Parmesan — that no mapmaker can draw without a headache.\n\nNow, with Marie Louise aging and the reversion looming, the time has come to settle matters. Representatives of Tuscany, Modena, and Lucca have gathered in Florence — under our watchful eye — to negotiate a comprehensive treaty that will rationalize borders, extinguish old claims, and finally deliver what Vienna promised."
 italy.5.a: "We shall preside over the negotiations and guarantee the outcome."
 italy.6.title: "The Question of Pietrasanta and Barga"
 italy.6.desc: "The draft treaty before us largely follows the Vienna settlement: Lucca reverts to Tuscany when the Bourbon-Parma depart for Parma, and Modena receives territorial compensation. But two vicariates — Pietrasanta and Barga — remain a wound that cannot be left unstitched.\n\nThe Congress of Vienna assigned these lands to Modena, but that assignment was made on paper by men who had never set foot in the Lunigiana. Pietrasanta and Barga have belonged to Florence for centuries. Their churches, their magistrates, their dialects, their marble workshops — all are Tuscan to the bone. And once Lucca returns to our crown, both vicariates will be territorially contiguous with the rest of the Grand Duchy, no longer separated by foreign soil.\n\nThese are not bargaining chips. They are Tuscan soil, adjacent to Tuscan lands, inhabited by Tuscans. We must press for their retention — even if it means reopening negotiations that Austria would prefer to see concluded."
 italy.6.a: "Demand that Pietrasanta and Barga remain Tuscan."
 italy.6.b: "On second thought, better not to risk it."
 italy.7.title: "The Tuscan Demands"
 italy.7.desc: "The Florentines seek to overturn one of the few provisions of the Vienna settlement that favored us. They claim Pietrasanta and Barga on the basis of history, contiguity, and sentiment — as if centuries of Este and Cybo-Malaspina rule in the Lunigiana counted for nothing. They offer us territories elsewhere in exchange: enclaves in the Garfagnana, adjustments along the Enza, perhaps even the cession of Guastalla from Parma when the reversion comes.\n\nThe question is whether we value principle over pragmatism. Pietrasanta's marble quarries would enrich our treasury, and Barga commands the Serchio valley. But a protracted dispute could sour relations with Tuscany and strain Vienna's patience. The Austrians are eager to see this treaty signed and the Sardinian claim extinguished.\n\nWe can accept the revision and pocket the compensation, or we can hold firm to the letter of Vienna and insist that both vicariates pass to Modena as originally promised."
 italy.7.a: "Reject the revision. We shall have what Vienna promised us, no less."
 italy.7.b: "Accept the Tuscan proposal. Pietrasanta and Barga are not worth a diplomatic crisis."
 italy.8.title: "The Modenese Refusal"
 italy.8.desc: "Modena has rejected our claim to Pietrasanta and Barga. Francis IV insists on the letter of the Vienna settlement and will not yield the two vicariates without a fight.\n\nWe have two paths before us. We can relent — accept the Congress borders as they stand, surrender Pietrasanta and Barga to Modena, and sign the treaty as Austria desires. The marble quarries of Pietrasanta and the hilltowns of Barga would pass from Florentine hands after centuries of rule.\n\nOr we can attempt a grander bargain. Our remaining exclaves in the Lunigiana — Pontremoli, Bagnone, Groppoli, Lusuolo, Terrarossa, Calice, Albiano, and others — are islands of Tuscan territory surrounded by foreign soil, a headache for our administration. We could offer to cede them to Parma in exchange for Parma surrendering the Duchy of Guastalla to Modena. Modena would gain fertile Emilian land far more valuable than mountain vicariates, Parma would consolidate its Lunigiana holdings, and we would keep Pietrasanta and Barga. Everyone gains — if they can see past their pride."
 italy.8.a: "Propose the grand exchange: our Lunigiana exclaves to Parma, Guastalla to Modena, and Pietrasanta and Barga remain ours."
 italy.8.b: "Relent. The Congress borders shall stand. We will sign the treaty as drafted."
 italy.9.title: "The Tuscan Counter-Proposal"
 italy.9.desc: "Florence has returned to the table with a new offer. Rather than simply demanding Pietrasanta and Barga, they propose a three-way exchange: Tuscany would cede its remaining Lunigiana exclaves to Parma, Parma would surrender the Duchy of Guastalla to us, and in return we would renounce our claim to Pietrasanta and Barga.\n\nThe arithmetic is worth considering. Guastalla is rich farmland on the Po plain — fertile, populated, and contiguous with our existing territories. Pietrasanta and Barga are mountainous vicariates, valuable for marble and strategic position, but separated from our core lands and populated by Tuscans who have never considered themselves Modenese. A straight exchange of remote exclaves for a productive duchy may serve our interests better than rigid adherence to a treaty signed thirty years ago by men long dead.\n\nYet principle matters. Vienna promised us those lands, and yielding to Florentine pressure may embolden future demands. The choice is ours."
 italy.9.a: "Accept the exchange. Guastalla is worth more than two mountain vicariates."
 italy.9.b: "Reject the proposal. We will not trade away what Vienna granted us."
 italy.10.title: "The Florentine Bargain"
 italy.10.desc: "Tuscany has approached us with a proposal that would redraw the map of the Lunigiana. They ask us to surrender the Duchy of Guastalla — the third jewel in our crown alongside Parma and Piacenza — and transfer it to Modena. In exchange, we would receive all of Tuscany's remaining exclaves in the Lunigiana: Pontremoli, Bagnone, Groppoli, Lusuolo, Terrarossa, Calice, Albiano, and the rest.\n\nThe trade is not an easy one. Guastalla is a fertile duchy on the Po, productive and prosperous, and its loss would reduce our title to merely Parma and Piacenza. But the Tuscan exclaves would consolidate our hold on the Lunigiana, eliminating the patchwork of foreign enclaves that have plagued our administration since 1815. A contiguous border has its own value — less smuggling, fewer disputes, cleaner maps.\n\nCritics will mock us for trading good Emilian soil for mountain rocks. But rocks that consolidate a realm may be worth more than farmland that remains an appendage. We must decide."
 italy.10.a: "Accept the exchange. Consolidated borders serve us better than scattered holdings."
 italy.10.b: "Reject the proposal. We will not trade Guastalla for a handful of Tuscan villages."
 italy.11.title: "The Negotiations Collapse"
 italy.11.desc: "The grand bargain has failed. Whether it was Modena's stubbornness, Parma's reluctance to part with Guastalla, or both, the three-way exchange is dead. Our ambassadors in Florence have exhausted every argument, every inducement, every appeal to reason and mutual interest.\n\nThe Congress of Vienna borders shall stand as written. Pietrasanta and Barga — Tuscan for centuries, Tuscan in every stone and spire — will pass to Modena when the reversion comes. Our remaining Lunigiana exclaves will remain scattered islands of Florentine administration in a foreign sea. The treaty will be signed on these terms, and Austria will have its tidy resolution.\n\nWe fought for what was ours. We lost. History will record whether Modena's gain was worth the bitterness sown between neighbors.;"
 italy.11.a: "So be it. Sign the treaty and let us be done with this affair."
 italy.12.title: "The Treaty is Signed"
 italy.12.desc: "The negotiations in Florence have concluded. After months of haggling over exclaves, vicariates, and the bones of dead treaties, the parties have reached an agreement. The reversion of Parma to the Bourbon-Parma upon Marie Louise's death is settled, Lucca's passage to Tuscany is confirmed, and the Sardinian claim from Aix-la-Chapelle is extinguished at last.\n\nThe treaty also provides a framework for mutual territorial exchanges to rationalize the borders between the duchies — eliminating the patchwork of enclaves that has plagued the Lunigiana and the Enza valley since 1815. These adjustments are optional: the core settlement stands without them, but implementing them would spare the Italian states decades of border disputes, smuggling, and administrative chaos.\n\nAs guarantor of the settlement, the decision falls to us. We can press all parties to accept the rationalization, or we can declare the matter closed and let them live with their crooked frontiers."
 italy.12.a: "Press for full rationalization. Clean borders make for a stable Italy."
 italy.12.b: "The treaty is enough. Let them sort out their own borders."
 italy.13.title: "The Death of Marie Louise"
 italy.13.desc: "On the 17th of December, 1847, Her Imperial and Royal Highness Marie Louise of Austria, Duchess of Parma, Piacenza, and Guastalla, breathed her last. The second wife of Napoleon Bonaparte and the daughter of Emperor Francis I, she had ruled the duchy for over three decades — a Habsburg archduchess planted on a Bonaparte throne, governing with a light hand that earned her the affection of her subjects.\n\nHer death triggers the long-awaited reversion. By the terms of the Final Act of the Congress of Vienna and the recent Treaty of Florence, the Duchy of Parma and Piacenza now passes to Charles Louis of Bourbon-Parma, who abdicates his throne in Lucca to assume his rightful inheritance. Lucca, in turn, reverts to the Grand Duchy of Tuscany.\n\nThe map of central Italy, frozen since 1815, begins to shift."
 italy.13.a: "The Duchess is dead. Long live the Duke — Charles II of Bourbon-Parma."
 italy.14.title: "Unrest in the Ceded Territories"
 italy.14.desc: "The transition has not been peaceful. In Pontremoli, the municipality has protested the cession to Parma and dispatched a delegation to Florence begging for our intervention — some hotheads in the city have even threatened to torch the town rather than submit to Bourbon rule. In Fivizzano, Modenese troops entering the city were met with an insurrection led by former Grand Ducal soldiers, which ended with one dead and several wounded before Francis V granted the rebels permission to remain in their homes.\n\nThe people of these lands do not wish to be Parmesan or Modenese. They are Tuscan — raised under Lorraine rule, accustomed to our laws and our leniency. Their revolt, however scattered and spontaneous, presents us with an opportunity. We could press our claim to reclaim the lost exclaves, arguing that the Treaty of Florence was imposed against the will of the inhabitants and that stability demands their return to Florentine administration.\n\nSuch a move would infuriate Parma and Modena, and Vienna would not look kindly on reopening a settlement it just guaranteed. But can we stand idle while Tuscans beg for our protection?;"
 italy.14.a: "Let it go. The treaty is signed and the ink is dry. We will not risk war for a few mountain towns."
 italy.14.b: "Press the claim. The people have spoken — Pontremoli and Fivizzano must return to Tuscany."
 italy.15.title: "The Reversion Takes Effect"
 italy.15.desc: "Marie Louise of Austria, Duchess of Parma, Piacenza, and Guastalla, is dead. The daughter of one emperor and the widow of another, she ruled her duchy with a gentle hand for thirty-one years. Her passing sets in motion the machinery that the Congress of Vienna designed in 1815 and the Treaty of Florence refined in 1844.\n\nThe settlement is complex but its logic is simple: the Bourbon-Parma, long exiled from their rightful throne and compensated with the Duchy of Lucca, now return to Parma. Lucca reverts to Tuscany. And the borders between the duchies — that tangle of exclaves and enclaves that has frustrated cartographers for a generation — are to be rationalized through mutual exchange.\n\nThe Grand Duke of Tuscany has raised no objection. Florence accepts the loss of its Lunigiana exclaves and will not contest the territorial adjustments. The transition, it seems, will proceed smoothly — a rare thing in Italian affairs."
 italy.15.a: "The treaty shall be executed as written. Let the borders be redrawn."
 italy.16.title: "The Reversion — and the Tuscan Demands"
 italy.16.desc: "Marie Louise of Austria, Duchess of Parma, Piacenza, and Guastalla, has died. By the terms of the Congress of Vienna and the Treaty of Florence, the Bourbon-Parma now assume their rightful throne in Parma, Lucca reverts to Tuscany, and the long-awaited territorial rationalization of the Lunigiana is to begin.\n\nBut Florence is not honoring the bargain. The Grand Duke, emboldened by pro-Tuscan unrest in Pontremoli and Fivizzano — where locals have protested, rioted, and in one case met Modenese troops with armed insurrection — now presses claims to retain the exclaves that the treaty assigned to us. He argues that the people of these lands are Tuscan by blood and sentiment, that the treaty was signed under Austrian pressure, and that stability demands their return to Florentine rule.\n\nThe claim is legally dubious but politically dangerous. The unrest is real, and Vienna may not wish to deploy troops to enforce a settlement that its own Italian clients are tearing apart. We must decide whether to concede the exclaves or hold firm."
 italy.16.a: "Accept the Tuscan claims. The exclaves are not worth a confrontation."
 italy.16.b: "Reject the demands. The treaty is the treaty — Florence must honor its signature."
 italy.17.title: "The Claims Rejected"
 italy.17.desc: "Our demands have been refused. The treaty stands, they say, and Florence must honor its signature. The exclaves of the Lunigiana — Tuscan in blood, Tuscan in history, Tuscan in the cries of their own people — will pass to foreign rule regardless.\n\nWe have two choices. We can offer compensation: territorial concessions elsewhere, a financial settlement that might sweeten the pill. A face-saving compromise that lets both sides claim victory.\n\nOr we can swallow the refusal. The ink is dry, the Austrians are watching, and pushing further risks isolating us from Vienna and making enemies of our neighbors. Sometimes a grand duke must accept that even righteous claims do not always prevail."
 italy.17.a: "Offer compensation. There must be a bargain they will accept."
 italy.17.b: "Accept the refusal. The treaty will stand and we will bear the loss with dignity."
 italy.18.title: "The Tuscan Offer"
 italy.18.desc: "Florence has returned with an offer. Rather than press the claim to our exclaves through force or endless diplomatic pressure, the Grand Duke proposes a financial settlement — a sum to compensate for the territories we would retain, paid from the Tuscan treasury in recognition of the sacrifice we make by honoring the treaty.\n\nThe money would fill our coffers and the matter would be closed. But accepting payment for land that is already ours by treaty sets an uncomfortable precedent. It suggests the claim had merit, and that our rights are commodities to be purchased rather than principles to be defended. Still — gold spends, and pride does not."
 italy.18.a: "Accept the compensation. Let Florence pay for its wounded pride."
 italy.18.b: "Reject the offer. We will not be bought off — the treaty speaks for itself."
 italy.19.title: "The Compensation Accepted"
 italy.19.desc: "They have accepted. The treasury will be lighter, but the matter is settled. Our payment has bought what diplomacy could not: an end to the dispute, a recognition — however tacit — that our claim was not without weight, and peace with a neighbor who might otherwise have become an enemy.\n\nThe Lunigiana exclaves will pass to foreign administration as the treaty demands. But we have not surrendered them for nothing. We have paid for the privilege of walking away with dignity, and in the tangled politics of Italy, dignity is a currency of its own."
 italy.19.a: "It is done. Let the borders be drawn and the past be buried."
 italy.20.title: "The Final Refusal"
 italy.20.desc: "They will not be moved. Not by argument, not by sentiment, not by gold. Our offer of compensation has been refused, and with it our last hope of a negotiated revision.\n\nThe Treaty of Florence will stand in every particular — unless we are willing to tear it up by force. Our army could march on the exclaves and seize what is ours before Modena or Parma can respond. The people of Pontremoli and Fivizzano would welcome us as liberators, and the blood spilled in their streets demands justice.\n\nBut we must be clear-eyed about the cost. Austria guaranteed the treaty. Vienna will not stand idle while a lesser power dismantles a settlement it brokered. A Tuscan march into the Lunigiana is almost certainly a declaration of war against the Habsburg Empire.\n\nSo the choice is this: swallow the insult and live, or draw the sword and risk everything for a handful of mountain towns that may become our grave."
 italy.20.a: "Swallow the insult. The treaty stands and we will endure."
 italy.20.b: "To arms. If Vienna wants a war over Pontremoli, let them come."
 italy.21.title: "The Final Reversion"
 italy.21.desc: "[ROOT.GetCountry.Custom('TreatyOfFlorenceOutcome')]"
 italy.21.a: "With one stroke, Italy will be stabilized, and our continued dominance assured."
 treaty_florence_outcome_1_rationalized: "The 1844 Treaty of Florence mostly reaffirmed the decisions made in the Final Act of the Congress of Vienna. Tuscany will reincorpoate Lucca, whereas Lucca's exclaves will go to Modena. Similarly, Tuscan exclaves in Fivizzano, Pietrasanta, and Barga will also go to the Modenese, while a set of exchanges will be made between the Modenese and Tuscan Pontremoli exclaves to rationalize their borders there. The border between Modena and Parma will be set along the Enza."
 treaty_florence_outcome_1_unrationalized: "The 1844 Treaty of Florence mostly reaffirmed the decisions made in the Final Act of the Congress of Vienna. Tuscany will reincorpoate Lucca, whereas Lucca's exclaves will go to Modena. Similarly, Tuscan exclaves in Fivizzano, Pietrasanta, and Barga will also go to the Modenese. However, the exclaves in Lunigiana will be allowed to remain, keeping them all dependent on us."
 treaty_florence_outcome_2_rationalized_mod: "The 1844 Treaty of Florence mostly reaffirmed the decisions made in the Final Act of the Congress of Vienna, with a few slight modifications. Tuscany will reincorpoate Lucca, whereas Lucca's exclaves will go to Modena. Similarly, the Tuscan exclave in Fivizzano will also go to the Modenese, but the Tuscans will get to keep Pietrasanta and Barga. A set of exchanges will be made between the Modenese and Tuscan Pontremoli exclaves to rationalize their borders there, and the border between Modena and Parma will be set along the Enza.\n\nHowever, as the Modenese have bowed under Tuscan demands to relinquish their claims on the Tuscan exclaves in Lunigiana, Tuscany has managed to reassert its control over its Fivizzano exclave."
