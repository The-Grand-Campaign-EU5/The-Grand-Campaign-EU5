 treaty_florence_outcome_3_rationalized_par_mod: "The 1844 Treaty of Florence, though reaffirmining the core points made in the Final Act of the Congress of Vienna, also made some significant changes. Tuscany will reincorpoate Lucca, whereas Lucca's exclaves will go to Modena. However, in exchange for retaining Pietrasanta and Barga, Tuscan exclaves in Lunigiana will go to Parma, with Modena receiving Guastalla in exchange. A set of exchanges will be made between the Parman and Modenese Pontremoli exclaves to rationalize their borders there, and the border between Modena and Parma will be set along the Enza.\n\nHowever, with both Parma and Modena bowing to Tuscan demands for the return of their exclaves, many sections have been rendered null, and it seems that Tuscany is the true victor of the treaty."
